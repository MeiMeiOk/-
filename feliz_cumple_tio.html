<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Feliz cumpleaños!</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(circle at top, #3949ab, #10152f 70%);
    color: white; text-align: center;
  }
  .message { position: relative; z-index: 2; padding: 28px; }
  h1 {
    margin: 0; font-size: clamp(2.5rem, 9vw, 5.5rem);
    line-height: 1.05; text-shadow: 0 5px 25px #0008;
    animation: pop 1s ease both;
  }
  p { font-size: clamp(1.1rem, 3vw, 1.5rem); margin-top: 22px; }
  .emoji { font-size: 3rem; margin-bottom: 18px; }
  .confetti {
    position: fixed; top: -20px; width: 10px; height: 18px;
    opacity: .95; animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translate3d(var(--drift), 110vh, 0) rotate(900deg); }
  }
  @keyframes pop {
    0% { transform: scale(.4); opacity: 0; }
    75% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <main class="message">
    <div class="emoji">🎉🥳</div>
    <h1>¡FELIZ<br>CUMPLEAÑOS<br>TIOOOOO!</h1>
  </main>
  <script>
    const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#c77dff", "#ffffff"];
    for (let i = 0; i < 100; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (3 + Math.random() * 5) + "s";
      piece.style.animationDelay = (-Math.random() * 8) + "s";
      piece.style.setProperty("--drift", (Math.random() * 240 - 120) + "px");
      piece.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
      document.body.appendChild(piece);
    }
  </script>
</body>
</html>
