<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0758d8">
<title>¡Feliz cumpleaños, tío!</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden}
body{min-height:100svh;display:grid;place-items:center;background:#0758d8;color:white;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.message{position:relative;z-index:2;width:100%;min-height:100svh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emoji{font-size:clamp(2.5rem,9vw,4.5rem);margin-bottom:22px}
h1{margin:0;font-size:clamp(2.6rem,10vw,6rem);line-height:1.04;font-weight:900;letter-spacing:-2px;text-shadow:0 5px 22px #00308066;animation:pop .9s ease both}
p{font-size:clamp(1.1rem,4vw,1.6rem);margin:24px 0}
button{border:0;border-radius:999px;padding:15px 25px;background:white;color:#0758d8;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #00308055}
.confetti{position:fixed;z-index:1;top:-24px;width:10px;height:18px;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),110svh,0) rotate(900deg)}}
@keyframes pop{0%{transform:scale(.45);opacity:0}75%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<main class="message">
<div class="emoji">🎉🎂🥳</div>
<h1>¡FELIZ<br>CUMPLEAÑOS<br>TIOOOOO!</h1>
<p>¡Que te la pases increíble! 🎊</p>
<button id="soundButton" type="button">🔊 ¡TOCA PARA ESCUCHAR YUPIIIII!</button>
</main>
<script>
const colors=["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#c77dff","#ffffff"];
for(let i=0;i<110;i++){
 const piece=document.createElement("span"); piece.className="confetti";
 piece.style.left=Math.random()*100+"vw";
 piece.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
 piece.style.animationDuration=(3+Math.random()*5)+"s";
 piece.style.animationDelay=(-Math.random()*8)+"s";
 piece.style.setProperty("--drift",(Math.random()*240-120)+"px");
 piece.style.borderRadius=Math.random()>.5?"50%":"2px";
 document.body.appendChild(piece);
}
document.getElementById("soundButton").addEventListener("click",()=>{
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){const ctx=new AC();[523.25,659.25,783.99,1046.5].forEach((f,i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;
   g.gain.setValueAtTime(.0001,ctx.currentTime+i*.13);
   g.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+i*.13+.025);
   g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.13+.22);
   o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.13);o.stop(ctx.currentTime+i*.13+.24);
  });}
 }catch(e){}
 if("speechSynthesis"in window){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance("¡Yupiiii!");
  u.lang="es-MX";u.rate=1.15;u.pitch=1.5;window.speechSynthesis.speak(u);
 }
});
</script>
</body>
</html>
